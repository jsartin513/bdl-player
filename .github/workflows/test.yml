name: Tests

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: bash scripts/with-bdl-git-auth.sh
        env:
          BDL_PACKAGES_READ_TOKEN: ${{ secrets.BDL_PACKAGES_READ_TOKEN }}
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_LEAGUE_CATALOG_URL: http://localhost:3000/api/public/leagues
